<div class="container nx-page">
    <div class="d-flex align-items-center justify-content-between">
        <h1 class="mb-0">Saved stories</h1>
        <span class="nx-muted small" ng-if="items.length">
            <span ng-bind="items.length"></span>
            <span ng-bind="items.length === 1 ? 'story' : 'stories'"></span>
        </span>
    </div>

    <p class="nx-muted small mt-2">
        Saved on this device only — nothing is uploaded to a server.
    </p>

    <div class="nx-empty" ng-if="!items.length">
        <i class="bi bi-heart d-block mb-3"></i>
        <p class="mb-1">Nothing saved yet.</p>
        <p class="small mb-3">Tap the heart on any story to keep it here.</p>
        <a class="btn btn-nx-accent btn-sm rounded-pill px-4" href="#/">Browse the feed</a>
    </div>

    <div ng-if="items.length" class="mt-3">
        <div class="nx-list-row" ng-repeat="item in items track by $index">
            <img class="nx-list-thumb" ng-if="item.imageUrl" ng-src="{{item.imageUrl}}"
                 alt="{{item.title}}">

            <div class="flex-grow-1">
                <p class="nx-list-title" ng-bind="item.title"></p>
                <div class="nx-muted" style="font-size:.75rem; margin-top:.3rem;">
                    <div>Source: <span ng-bind="item.publisher || 'Publisher not stated'"></span></div>
                    <div ng-if="item.publishedLabel">
                        Published: <span ng-bind="item.publishedLabel"></span>
                    </div>
                </div>
                <a class="small d-inline-block mt-1" ng-if="item.articleLink"
                   ng-href="{{item.articleLink}}" target="_blank" rel="noopener noreferrer">
                    Read original article <i class="bi bi-box-arrow-up-right"></i>
                </a>
            </div>

            <button class="btn btn-nx btn-nx-icon" ng-click="remove(item, $index)"
                    title="Remove" aria-label="Remove from saved">
                <i class="bi bi-trash3"></i>
            </button>
        </div>
    </div>
</div>
