<div class="portal" ng-class="{ 'sidebar-collapsed': $ctrl.collapsed, 'mobile-open': $ctrl.mobileOpen }">

  <aside class="portal-sidebar" ng-class="'role-' + $ctrl.role">
    <div class="portal-brand">
      <img src="assets/img/logo.svg" alt="" />
      <span ng-if="!$ctrl.collapsed">Alfalah<small>{{ $ctrl.role | uppercase }} PORTAL</small></span>
    </div>

    <nav class="portal-nav" aria-label="Portal">
      <button type="button" class="portal-link" ng-repeat="item in $ctrl.menu"
              ng-class="{ active: item.id === $ctrl.active }"
              ng-click="$ctrl.select(item.id)" title="{{ item.label }}">
        <i class="bi" ng-class="item.icon"></i>
        <span ng-if="!$ctrl.collapsed">{{ item.label }}</span>
      </button>
    </nav>

    <div class="portal-sidebar-footer">
      <button type="button" class="portal-link text-danger" ng-click="$ctrl.onLogout()">
        <i class="bi bi-box-arrow-left"></i><span ng-if="!$ctrl.collapsed">Logout</span>
      </button>
    </div>
  </aside>

  <div class="portal-backdrop" ng-click="$ctrl.mobileOpen = false"></div>

  <div class="portal-main">
    <header class="portal-topbar">
      <div class="d-flex align-items-center gap-2">
        <button class="icon-btn d-none d-lg-inline-flex" ng-click="$ctrl.toggle()" aria-label="Collapse sidebar"><i class="bi bi-list"></i></button>
        <button class="icon-btn d-lg-none" ng-click="$ctrl.mobileOpen = !$ctrl.mobileOpen" aria-label="Menu"><i class="bi bi-list"></i></button>
        <div>
          <div class="text-body-secondary small">{{ $ctrl.title }}</div>
          <h6 class="mb-0 fw-bold">{{ $ctrl.activeLabel() }}</h6>
        </div>
      </div>
      <div class="d-flex align-items-center gap-2">
        <button class="theme-toggle" ng-click="$ctrl.toggleTheme()" aria-label="Toggle theme">
          <i class="bi" ng-class="$ctrl.theme() === 'dark' ? 'bi-sun-fill' : 'bi-moon-stars-fill'"></i>
        </button>
        <a class="icon-btn" href="#!/" title="Public site" aria-label="Public site"><i class="bi bi-globe2"></i></a>
        <div class="portal-user">
          <div class="portal-avatar">{{ ($ctrl.user.name || 'U') | limitTo:1 }}</div>
          <div class="d-none d-sm-block">
            <div class="fw-semibold small">{{ $ctrl.user.name || 'User' }}</div>
            <div class="text-body-secondary" style="font-size:.72rem">{{ $ctrl.user.email }}</div>
          </div>
        </div>
      </div>
    </header>

    <div class="portal-content" ng-transclude></div>
  </div>
</div>
