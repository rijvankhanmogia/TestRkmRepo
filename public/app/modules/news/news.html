<!-- ===================== HEADER ===================== -->
<section class="section-tight bg-soft">
  <div class="container container-aa text-center">
    <span class="eyebrow reveal"><i class="bi bi-newspaper"></i>News &amp; Events</span>
    <h1 class="mt-3 mb-3 reveal delay-1">Latest Updates from Alfalah</h1>
    <p class="lead mb-0 mx-auto reveal delay-2" style="max-width:720px">News, notices, events and circulars — everything happening at our campus.</p>
  </div>
</section>

<!-- ===================== NEWS LIST ===================== -->
<section class="section">
  <div class="container container-aa">

    <!-- Category chips -->
    <div class="d-flex flex-wrap justify-content-center gap-2 mb-5 reveal">
      <button ng-repeat="c in vm.categories"
              class="btn btn-sm"
              ng-class="vm.category === c ? 'btn-accent' : 'btn-ghost'"
              ng-click="vm.setCategory(c)">{{ c }}</button>
    </div>

    <!-- Loading skeletons -->
    <div class="row g-4" ng-if="vm.loading">
      <div class="col-md-6 col-lg-4" ng-repeat="i in [1,2,3,4,5,6]">
        <div class="aa-card"><div class="card-body">
          <div class="skeleton skeleton-line" style="width:40%"></div>
          <div class="skeleton skeleton-line" style="width:90%"></div>
          <div class="skeleton skeleton-line" style="width:80%"></div>
          <div class="skeleton skeleton-line" style="width:60%"></div>
        </div></div>
      </div>
    </div>

    <!-- Cards -->
    <div class="row g-4" ng-if="!vm.loading">
      <div class="col-md-6 col-lg-4" ng-repeat="n in vm.items | filter:vm.matches">
        <div class="aa-card h-100 reveal" ng-class="'delay-' + ($index % 4)">
          <div class="card-body d-flex flex-column">
            <div class="mb-2">
              <span class="badge-soft">{{ n.category }}</span>
              <span class="text-body-secondary small ms-2"><i class="bi bi-calendar3 me-1"></i>{{ vm.formatDate(n.date) }}</span>
            </div>
            <h5 class="mb-2">{{ n.title }}</h5>
            <p class="mb-3">{{ n.excerpt }}</p>
            <a ng-href="#!/news/{{ n.id }}" class="btn btn-ghost btn-sm mt-auto align-self-start">Read more <i class="bi bi-arrow-right ms-1"></i></a>
          </div>
        </div>
      </div>

      <!-- Empty state -->
      <div class="col-12 text-center py-5" ng-if="!(vm.items | filter:vm.matches).length">
        <div class="feature-icon soft mx-auto mb-3"><i class="bi bi-inbox"></i></div>
        <p class="text-body-secondary mb-0">No updates in this category yet.</p>
      </div>
    </div>
  </div>
</section>
