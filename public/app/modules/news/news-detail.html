<section class="section">
  <div class="container container-aa" style="max-width:820px">

    <!-- Back link -->
    <a href="#!/news" class="btn btn-ghost btn-sm mb-4 reveal"><i class="bi bi-arrow-left me-1"></i>Back to News</a>

    <!-- Loading skeleton -->
    <div ng-if="vm.loading" class="aa-card"><div class="card-body">
      <div class="skeleton skeleton-line" style="width:30%"></div>
      <div class="skeleton skeleton-line" style="width:80%"></div>
      <div class="skeleton skeleton-line" style="width:100%"></div>
      <div class="skeleton skeleton-line" style="width:95%"></div>
      <div class="skeleton skeleton-line" style="width:70%"></div>
    </div></div>

    <!-- Not found -->
    <div ng-if="!vm.loading && !vm.item" class="text-center py-5">
      <div class="feature-icon soft mx-auto mb-3"><i class="bi bi-file-earmark-x"></i></div>
      <h4 class="mb-2">Article Not Found</h4>
      <p class="text-body-secondary mb-4">The update you are looking for may have been moved or removed.</p>
      <a href="#!/news" class="btn btn-accent">View All News</a>
    </div>

    <!-- Article -->
    <article ng-if="!vm.loading && vm.item">
      <div class="mb-3 reveal">
        <span class="badge-soft">{{ vm.item.category }}</span>
        <span class="text-body-secondary small ms-2"><i class="bi bi-calendar3 me-1"></i>{{ vm.formatDate(vm.item.date) }}</span>
      </div>
      <h1 class="mb-4 reveal delay-1">{{ vm.item.title }}</h1>
      <div class="aa-card reveal delay-2"><div class="card-body">
        <div ng-bind-html="vm.item.body"></div>
      </div></div>

      <div class="mt-4 reveal delay-2">
        <a href="#!/news" class="btn btn-ghost"><i class="bi bi-arrow-left me-1"></i>Back to all updates</a>
      </div>
    </article>
  </div>
</section>
