<!DOCTYPE html>
<html lang="en" ng-app="alfalahApp" ng-controller="RootController as root" ng-attr-data-bs-theme="{{ root.theme }}">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#1d4ed8" />

  <title>Alfalah Academy | Nurturing Knowledge, Building Character</title>
  <meta name="description" content="Alfalah Academy, Sultana (Chirawa, Jhunjhunu, Rajasthan) — a modern school with smart classrooms, science & computer labs, sports and holistic development. Admissions open." />
  <meta name="keywords" content="Alfalah Academy, school in Sultana, Chirawa school, Jhunjhunu school, best school Rajasthan, admissions" />
  <meta name="author" content="Alfalah Academy" />
  <link rel="canonical" href="https://alfalahacademy.example/" />

  <!-- Open Graph -->
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="Alfalah Academy" />
  <meta property="og:title" content="Alfalah Academy | Nurturing Knowledge, Building Character" />
  <meta property="og:description" content="A modern educational institution in Sultana, Chirawa. Admissions open." />
  <meta property="og:image" content="assets/img/og-cover.svg" />
  <meta property="og:locale" content="en_IN" />

  <!-- Twitter -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Alfalah Academy" />
  <meta name="twitter:description" content="Nurturing Knowledge, Building Character." />
  <meta name="twitter:image" content="assets/img/og-cover.svg" />

  <!-- PWA -->
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" type="image/svg+xml" href="assets/img/logo.svg" />
  <link rel="apple-touch-icon" href="assets/img/logo.svg" />

  <!-- Vendor CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />

  <!-- App CSS -->
  <link rel="stylesheet" href="assets/css/theme.css" />
  <link rel="stylesheet" href="assets/css/main.css" />
  <link rel="stylesheet" href="assets/css/portal.css" />
  <link rel="stylesheet" href="assets/css/animations.css" />

  <!-- JSON-LD structured data -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "EducationalOrganization",
    "name": "Alfalah Academy",
    "url": "https://alfalahacademy.example/",
    "email": "alfalahacademysultana@gmail.com",
    "address": {
      "@type": "PostalAddress",
      "streetAddress": "Kishorpura Road, Sultana",
      "addressLocality": "Chirawa",
      "addressRegion": "Rajasthan",
      "postalCode": "333028",
      "addressCountry": "IN"
    },
    "geo": { "@type": "GeoCoordinates", "latitude": 28.124088, "longitude": 75.609324 }
  }
  </script>
</head>

<body>
  <!-- Skip link for accessibility -->
  <a href="#main-content" class="skip-link">Skip to content</a>

  <!-- Top progress / loading bar -->
  <div class="app-loading-bar" ng-if="root.loading" role="status" aria-label="Loading"></div>

  <!-- Public navbar (hidden inside portals) -->
  <site-navbar ng-if="!root.isPortal"></site-navbar>

  <!-- Toast notifications -->
  <toast-host></toast-host>

  <main id="main-content" ng-view class="app-view" aria-live="polite"></main>

  <!-- Public footer (hidden inside portals) -->
  <site-footer ng-if="!root.isPortal"></site-footer>

  <!-- Back to top -->
  <button type="button" class="btn-back-to-top" ng-if="!root.isPortal" ng-click="root.scrollTop()" aria-label="Back to top">
    <i class="bi bi-arrow-up"></i>
  </button>

  <!-- Vendor JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
          integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/angular@1.8.3/angular.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/angular-route@1.8.3/angular-route.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/angular-animate@1.8.3/angular-animate.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/angular-sanitize@1.8.3/angular-sanitize.min.js"></script>

  <!-- App core -->
  <script src="app/app.module.js"></script>
  <script src="app/app.config.js"></script>
  <script src="app/app.routes.js"></script>
  <script src="app/app.run.js"></script>

  <!-- Core services -->
  <script src="app/core/services/config.service.js"></script>
  <script src="app/core/services/api.service.js"></script>
  <script src="app/core/services/auth.service.js"></script>
  <script src="app/core/services/theme.service.js"></script>
  <script src="app/core/services/toast.service.js"></script>
  <script src="app/core/services/seo.service.js"></script>

  <!-- Shared components / directives -->
  <script src="app/shared/navbar/navbar.component.js"></script>
  <script src="app/shared/footer/footer.component.js"></script>
  <script src="app/shared/components/section-heading.component.js"></script>
  <script src="app/shared/components/toast-host.component.js"></script>
  <script src="app/shared/components/count-up.directive.js"></script>
  <script src="app/shared/components/reveal.directive.js"></script>
  <script src="app/shared/portal-shell/portal-shell.component.js"></script>

  <!-- Public modules -->
  <script src="app/modules/home/home.controller.js"></script>
  <script src="app/modules/about/about.controller.js"></script>
  <script src="app/modules/faculty/faculty.controller.js"></script>
  <script src="app/modules/gallery/gallery.controller.js"></script>
  <script src="app/modules/news/news.controller.js"></script>
  <script src="app/modules/academics/academics.controller.js"></script>
  <script src="app/modules/admissions/admissions.controller.js"></script>
  <script src="app/modules/contact/contact.controller.js"></script>
  <script src="app/modules/enquiry/enquiry.controller.js"></script>

  <!-- Auth + portals -->
  <script src="app/modules/auth/login.controller.js"></script>
  <script src="app/modules/student/student.controller.js"></script>
  <script src="app/modules/teacher/teacher.controller.js"></script>
  <script src="app/modules/admin/admin.controller.js"></script>

  <!-- Root controller -->
  <script src="app/root.controller.js"></script>

  <!-- Service worker registration -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('service-worker.js').catch(function () {});
      });
    }
  </script>
</body>
</html>
