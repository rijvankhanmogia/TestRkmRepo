
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact — Mohd Rijvan Khan Mogia</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#0A0F16;
    --panel:#111823;
    --line:#1F2A38;
    --text:#E7EDF3;
    --muted:#8FA1B3;
    --amber:#F2A93B;
    --green:#3DDC97;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{
    background:var(--ink);
    color:var(--text);
    font-family:'IBM Plex Mono', monospace;
    min-height:100vh;
  }
  body{
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px;
    background-image:
      linear-gradient(var(--line) 1px, transparent 1px),
      linear-gradient(90deg, var(--line) 1px, transparent 1px);
    background-size:34px 34px;
    background-position:center;
  }
  .card{
    width:100%;
    max-width:480px;
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:14px;
    box-shadow:0 30px 60px -20px rgba(0,0,0,0.6);
    overflow:hidden;
  }
  .titlebar{
    display:flex;
    align-items:center;
    gap:8px;
    padding:12px 16px;
    border-bottom:1px solid var(--line);
  }
  .dot{width:10px;height:10px;border-radius:50%;}
  .dot.r{background:#FF5F57;}
  .dot.y{background:#FEBC2E;}
  .dot.g{background:#28C840;}
  .titlebar span{
    margin-left:auto;
    font-size:11px;
    color:var(--muted);
    letter-spacing:0.06em;
  }
  .content{padding:36px 32px 32px;}
  .eyebrow{
    font-size:11px;
    letter-spacing:0.18em;
    text-transform:uppercase;
    color:var(--amber);
    display:flex;
    align-items:center;
    gap:8px;
    margin-bottom:18px;
  }
  .eyebrow::before{
    content:'';
    width:7px;height:7px;border-radius:50%;
    background:var(--green);
    box-shadow:0 0 0 0 rgba(61,220,151,0.6);
    animation:pulse 2.2s infinite;
  }
  @media (prefers-reduced-motion: reduce){
    .eyebrow::before{animation:none;}
    .caret{animation:none;}
  }
  @keyframes pulse{
    0%{box-shadow:0 0 0 0 rgba(61,220,151,0.55);}
    70%{box-shadow:0 0 0 6px rgba(61,220,151,0);}
    100%{box-shadow:0 0 0 0 rgba(61,220,151,0);}
  }
  h1{
    font-family:'Space Grotesk', sans-serif;
    font-weight:700;
    font-size:28px;
    line-height:1.25;
    letter-spacing:-0.01em;
    color:var(--text);
  }
  .caret{
    display:inline-block;
    width:3px;
    height:22px;
    background:var(--amber);
    margin-left:6px;
    vertical-align:-3px;
    animation:blink 1.1s steps(2) infinite;
  }
  @keyframes blink{50%{opacity:0;}}
  .role{
    margin-top:6px;
    font-size:13px;
    color:var(--muted);
  }
  .divider{
    height:1px;
    background:var(--line);
    margin:26px 0;
  }
  .field{
    display:flex;
    flex-direction:column;
    gap:4px;
    margin-bottom:20px;
  }
  .field:last-child{margin-bottom:0;}
  .label{
    font-size:10px;
    letter-spacing:0.14em;
    text-transform:uppercase;
    color:var(--muted);
  }
  .value a{
    color:var(--text);
    text-decoration:none;
    font-size:15px;
    border-bottom:1px solid var(--line);
    transition:color .15s ease, border-color .15s ease;
  }
  .value a:hover, .value a:focus-visible{
    color:var(--amber);
    border-color:var(--amber);
  }
  .value a:focus-visible{
    outline:2px solid var(--amber);
    outline-offset:3px;
    border-radius:2px;
  }
  .value{font-size:15px;}
  footer{
    padding:16px 32px 26px;
    font-size:11px;
    color:var(--muted);
    border-top:1px solid var(--line);
    letter-spacing:0.04em;
  }
</style>
</head>
<body>

  <div class="card">
    <div class="titlebar">
      <span class="dot r"></span>
      <span class="dot y"></span>
      <span class="dot g"></span>
      <span>contact.card</span>
    </div>

    <div class="content">
      <div class="eyebrow">Available for contact</div>

      <h1>Mohd Rijvan Khan Mogia<span class="caret"></span></h1>
      <div class="role">Backend &amp; Mobile Developer</div>

      <div class="divider"></div>

      <div class="field">
        <div class="label">Email</div>
        <div class="value"><a href="mailto:rijvankhanmogia@gmail.com">rijvankhanmogia@gmail.com</a></div>
      </div>

      <div class="field">
        <div class="label">Phone</div>
        <div class="value"><a href="tel:+918828117342">+91 88281 17342</a></div>
      </div>

      <div class="field">
        <div class="label">Website</div>
        <div class="value"><a href="https://indian-ai-gamma.vercel.app/" target="_blank" rel="noopener">indian-ai.vercel.app</a></div>
      </div>
    </div>

    <footer>// reach out anytime — usually replies within a day</footer>
  </div>

</body>
</html>
